# Runs the tests on every PR (and on main) against a throwaway Postgres.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hn_ci
          POSTGRES_PASSWORD: hn_ci
          POSTGRES_DB: hn_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://hn_ci:hn_ci@localhost:5432/hn_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Create the tables
        run: for f in sql/*.sql; do psql -v ON_ERROR_STOP=1 "$TEST_DATABASE_URL" -f "$f"; done

      - name: Build and test the dbt models
        env:
          DBT_HOST: localhost
          DBT_PORT: "5432"
          DBT_USER: hn_ci
          DBT_PASSWORD: hn_ci
          DBT_DBNAME: hn_ci
          DBT_SCHEMA: dbt_ci
        run: dbt build --project-dir dbt --profiles-dir dbt
